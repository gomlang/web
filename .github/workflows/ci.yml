name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/verification/.github/workflows/ecosystem-ci.yml@aa5bbe56806b111b4051d23bcb1e8411fed41f12
    with:
      module: web
      verification-ref: aa5bbe56806b111b4051d23bcb1e8411fed41f12
