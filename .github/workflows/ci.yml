name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/workflows/.github/workflows/ecosystem-ci.yml@b0237a059e32961836ab635116ff741b19bff48f
    with:
      module: web
      workflows-ref: b0237a059e32961836ab635116ff741b19bff48f
