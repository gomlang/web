name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: gomlang/workflows/.github/workflows/ecosystem-ci.yml@84fe6d0fa7e5b937c65d557fac97d0fd3e19b3c8
    with:
      module: web
      workflows-ref: 84fe6d0fa7e5b937c65d557fac97d0fd3e19b3c8
